# ============================================================
# sample-workloads.yaml
# Deploys demo microservices across 5 namespaces.
# Each namespace has multiple pods with varied resource patterns
# so the AI agents have realistic data to analyse.
#
# Namespaces:
#   production      — web-frontend, api-server, redis-cache, auth-service
#   monitoring      — prometheus, grafana, alertmanager
#   data-processing — spark-worker, kafka-consumer, etl-job (bursty CPU)
#   storage         — postgres-db, minio (PVC-heavy)
#   dev             — test-runner, debug-pod, load-simulator
#
# Apply with:
#   kubectl apply -f k8s/namespaces.yaml
#   kubectl apply -f k8s/sample-workloads.yaml
# ============================================================


# ===========================================================
# NAMESPACE: production
# ===========================================================

# --- PVCs for production ---
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-logs-pvc
  namespace: production
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi

---
# web-frontend — normal stable workload
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: production
  labels:
    app: web-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"

---
# api-server — moderate CPU, mounts PVC for logs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: production
  labels:
    app: api-server
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
        tier: backend
    spec:
      containers:
      - name: api
        image: python:3.11-slim
        command: ["python", "-c", "import time; [time.sleep(1) for _ in iter(int, 1)]"]
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: logs
          mountPath: /var/log/api
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: api-logs-pvc

---
# redis-cache — low resource, high connection dependency
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  namespace: production
  labels:
    app: redis-cache
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
        tier: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

---
# auth-service — intentionally has NO resource limits (bad QoS demo)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: production
  labels:
    app: auth-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: backend
    spec:
      containers:
      - name: auth
        image: python:3.11-slim
        command: ["python", "-c", "import time; [time.sleep(1) for _ in iter(int, 1)]"]
        # NO resources.requests or limits — triggers "Burstable/BestEffort" QoS warning


# ===========================================================
# NAMESPACE: monitoring
# ===========================================================

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data-pvc
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    component: metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        component: metrics
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.52.0
        ports:
        - containerPort: 9090
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        volumeMounts:
        - name: data
          mountPath: /prometheus
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
    component: visualization
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        component: visualization
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.4.2
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "400m"
            memory: "512Mi"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
    component: alerting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
        component: alerting
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.27.0
        ports:
        - containerPort: 9093
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"


# ===========================================================
# NAMESPACE: data-processing
# ===========================================================

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-output-pvc
  namespace: data-processing
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi

---
# spark-worker — simulates bursty CPU workload
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: data-processing
  labels:
    app: spark-worker
    role: compute
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
        role: compute
    spec:
      containers:
      - name: worker
        image: python:3.11-slim
        # Bursty CPU: runs a math loop to simulate a processing spike
        command:
        - python
        - -c
        - |
          import time, math
          while True:
              # Compute burst
              [math.sqrt(i) for i in range(500000)]
              time.sleep(5)
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        volumeMounts:
        - name: output
          mountPath: /data/output
      volumes:
      - name: output
        persistentVolumeClaim:
          claimName: spark-output-pvc

---
# kafka-consumer — steady I/O, shares output PVC with spark-worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
  namespace: data-processing
  labels:
    app: kafka-consumer
    role: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-consumer
  template:
    metadata:
      labels:
        app: kafka-consumer
        role: ingestion
    spec:
      containers:
      - name: consumer
        image: python:3.11-slim
        command: ["python", "-c", "import time; [time.sleep(0.5) for _ in iter(int, 1)]"]
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "600m"
            memory: "512Mi"
        volumeMounts:
        - name: output
          mountPath: /data/output
      volumes:
      - name: output
        persistentVolumeClaim:
          claimName: spark-output-pvc

---
# etl-job — high memory, simulates an ETL pipeline that may OOM
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl-job
  namespace: data-processing
  labels:
    app: etl-job
    role: etl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etl-job
  template:
    metadata:
      labels:
        app: etl-job
        role: etl
    spec:
      containers:
      - name: etl
        image: python:3.11-slim
        command:
        - python
        - -c
        - |
          import time
          # Simulate growing memory usage
          data = []
          while True:
              data.append('x' * 1024 * 50)   # grow ~50KB each cycle
              if len(data) > 2000:
                  data = data[-500:]          # eventually reclaim
              time.sleep(0.1)
        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "700m"
            memory: "1500Mi"


# ===========================================================
# NAMESPACE: storage
# ===========================================================

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: storage
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data-pvc
  namespace: storage
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 30Gi

---
# postgres — persistent database with own PVC
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: storage
  labels:
    app: postgres-db
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
        tier: database
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_PASSWORD
          value: "hackathon123"
        - name: POSTGRES_DB
          value: "appdb"
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "800m"
            memory: "1Gi"
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: postgres-data-pvc

---
# minio — object storage, heavy disk I/O
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: storage
  labels:
    app: minio
    tier: objectstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        tier: objectstore
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        command: ["minio", "server", "/data", "--console-address", ":9001"]
        env:
        - name: MINIO_ROOT_USER
          value: "minioadmin"
        - name: MINIO_ROOT_PASSWORD
          value: "minioadmin"
        ports:
        - containerPort: 9000
        - containerPort: 9001
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "600m"
            memory: "1Gi"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: minio-data-pvc


# ===========================================================
# NAMESPACE: dev
# ===========================================================

---
# test-runner — intermittent pod, simulates CI test bursts
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-runner
  namespace: dev
  labels:
    app: test-runner
    env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-runner
  template:
    metadata:
      labels:
        app: test-runner
        env: dev
    spec:
      containers:
      - name: runner
        image: python:3.11-slim
        command: ["python", "-c", "import time; [time.sleep(2) for _ in iter(int, 1)]"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "400m"
            memory: "512Mi"

---
# debug-pod — intentionally crashloops to generate restart events
apiVersion: v1
kind: Pod
metadata:
  name: debug-crashloop
  namespace: dev
  labels:
    app: debug-crashloop
    env: dev
spec:
  restartPolicy: Always
  containers:
  - name: crasher
    image: busybox:latest
    command: ["sh", "-c", "echo 'Starting...'; sleep 5; exit 1"]
    resources:
      requests:
        cpu: "10m"
        memory: "16Mi"
      limits:
        cpu: "50m"
        memory: "32Mi"

---
# load-simulator — generates artificial network/CPU load for the demo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-simulator
  namespace: dev
  labels:
    app: load-simulator
    env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-simulator
  template:
    metadata:
      labels:
        app: load-simulator
        env: dev
    spec:
      containers:
      - name: loadgen
        image: python:3.11-slim
        command:
        - python
        - -c
        - |
          import time, math, random
          while True:
              intensity = random.randint(1, 10)
              [math.factorial(random.randint(100, 1000)) for _ in range(intensity * 500)]
              time.sleep(random.uniform(1, 3))
        resources:
          requests:
            cpu: "200m"
            memory: "128Mi"
          limits:
            cpu: "800m"
            memory: "256Mi"
